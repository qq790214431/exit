<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>小红书主页链接采集工具</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <div class="title">小红书主页链接采集工具</div>
  <div class="status" id="status">未开始</div>
</header>

<section class="data-dir">
  <span class="label">数据目录</span>
  <span class="path" id="dataDir">-</span>
  <button id="pickDirBtn">选择目录…</button>
  <button id="openDirBtn">打开目录</button>
</section>

<section class="settings">
  <label>并发 <input id="concurrency" type="number" min="1" max="8" value="3" /></label>
  <label>每轮上限 <input id="max" type="number" min="0" value="0" title="0=不限制" /></label>
  <label>验证码熔断 <input id="captchaBurst" type="number" min="1" max="30" value="8" /></label>
  <label>冷却(秒) <input id="cooldown" type="number" min="0" max="3600" value="600" /></label>
  <button id="startBtn" class="primary">▶ 开始采集</button>
  <button id="stopBtn" class="danger">■ 停止</button>
  <button id="exportBtn">导出 CSV</button>
</section>

<section class="progress-area">
  <div class="bar-label">
    <span id="overallText">0 / 0</span>
    <span id="roundText"></span>
    <span id="percent">0%</span>
  </div>
  <div class="bar"><div class="fill" id="overallBar"></div></div>
  <div class="chips" id="chips"></div>
</section>

<section class="filter-bar">
  <input id="search" type="text" placeholder="🔍 搜索昵称 / 小红书号 / 地区…" />
  <select id="regionFilter"><option value="">全部地区</option></select>
  <input id="fansMin" type="number" placeholder="粉丝≥" min="0" />
  <span class="tilde">~</span>
  <input id="fansMax" type="number" placeholder="粉丝≤" min="0" />
  <select id="statusFilter">
    <option value="">全部状态</option>
    <option value="ok">成功</option>
    <option value="captcha">验证码</option>
    <option value="error">错误</option>
    <option value="no_data">无数据</option>
  </select>
  <button id="clearFilter" class="ghost">清空筛选</button>
  <span class="filter-count" id="filterCount"></span>
</section>

<section class="charts">
  <div class="chart-box">
    <div class="chart-title">地区分布 TOP15</div>
    <div id="chartRegion" class="chart"></div>
  </div>
  <div class="chart-box">
    <div class="chart-title">粉丝数区间分布</div>
    <div id="chartFans" class="chart"></div>
  </div>
</section>

<main>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th data-key="nickname">昵称 ⇅</th>
        <th data-key="red_id">小红书号 ⇅</th>
        <th data-key="region">地区属地 ⇅</th>
        <th data-key="followers">粉丝数 ⇅</th>
        <th data-key="followers_num">粉丝数(数值) ⇅</th>
        <th>标签</th>
        <th data-key="status">状态 ⇅</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="log-wrap">
    <div class="log-title">运行日志</div>
    <pre id="log"></pre>
  </div>
</main>

<script src="echarts.min.js"></script>
<script src="renderer.js"></script>
</body>
</html>
